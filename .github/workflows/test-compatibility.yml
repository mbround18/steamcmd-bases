name: Test Wine/Proton Compatibility

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-docker:
    name: Test Docker Image Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build base image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: base
          push: false
          tags: steamcmd:base-test

      - name: Build wine image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: wine
          push: false
          tags: steamcmd:wine-test

      - name: Build proton image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: proton
          push: false
          tags: steamcmd:proton-test

  compatibility-matrix:
    name: Build Compatibility Matrix
    runs-on: ubuntu-latest
    needs: [test-docker]
    if: always()
    steps:
      - name: Generate compatibility report
        run: |
          echo "# Wine/Proton Compatibility Test Results"
          echo ""
          echo "| Platform | Status | Notes |"
          echo "|----------|--------|-------|"
          echo "| Docker Images | ${{ needs.test-docker.result == 'success' && '✅ PASS' || '❌ FAIL' }} | Built via Dockerfile (includes test binaries) |"
