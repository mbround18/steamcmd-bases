name: Docker Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  docker-release:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [base, wine, proton]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: mbround18/paws/actions/paws-up@main

      - name: paws docker (${{ matrix.target }})
        env:
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          paws docker \
            --image "mbround18/steamcmd" \
            --target "${{ matrix.target }}" \
            --prepend-target \
            --registries ghcr.io \
            --with-latest \
            --dockerhub-username mbround18 \
            --ghcr-username mbround18

  tagger:
    needs: docker-release
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: mbround18/paws/actions/paws-up@main

      - name: Compute and push next tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: paws semver --branch main --push
