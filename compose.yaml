services:
  # `docker compose build`/`push` work directly against these (handy for local
  # iteration). CI and multi-tag/registry-cache pushes go through
  # `docker buildx bake` instead (see docker-bake.hcl / Makefile) - that stays
  # the source of truth for tagging/caching, this is the lightweight mirror.
  # Either way: `cargo build --release` must have run first (see Makefile),
  # since the wine/proton targets COPY target/release/{test-exe,dockerify}.
  steamcmd:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    image: mbround18/steamcmd:base-${TAG:-latest}
    restart: no

  steamcmd-wine:
    build:
      context: .
      dockerfile: Dockerfile
      target: wine
    image: mbround18/steamcmd:wine-${TAG:-latest}
    restart: no

  steamcmd-proton:
    build:
      context: .
      dockerfile: Dockerfile
      target: proton
      args:
        PROTON_VERSION: ${PROTON_VERSION:-latest}
    image: mbround18/steamcmd:proton-${TAG:-latest}
    restart: no
